# Full local stack for machines with Docker. The Windows build machine used embedded Postgres instead.
name: track-site
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: tracksite_dev
    ports: ["54330:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: localdev
    volumes:
      - chdata:/var/lib/clickhouse
    profiles: ["full"]

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,s3,kms
      AWS_DEFAULT_REGION: eu-central-1
    ports: ["4566:4566"]
    profiles: ["full"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev123
    ports: ["9002:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    profiles: ["full"]

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    profiles: ["full"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports: ["4318:4318"]
    profiles: ["full"]

volumes:
  pgdata:
  chdata:
  miniodata:
