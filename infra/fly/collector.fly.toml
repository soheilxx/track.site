# Fly.io app for the collector (EU, Frankfurt). Deploy from the repository root:
#   fly launch --no-deploy --config infra/fly/collector.fly.toml --name track-site-collector --region fra
#   fly secrets set -a track-site-collector DATABASE_URL=... MASTER_KEY=... MASTER_KEY_ID=... CONFIG_SIGNING_PUBLIC_KEY=... (see .env.example)
#   fly deploy --config infra/fly/collector.fly.toml --dockerfile infra/docker/collector.Dockerfile
app = "track-site-collector"
primary_region = "fra"

[build]
  dockerfile = "../docker/collector.Dockerfile"

[env]
  APP_ENV = "production"
  NODE_ENV = "production"
  COLLECTOR_PORT = "3100"
  DATA_REGION = "eu"
  QUEUE_DRIVER = "pg"
  EVENT_STORE_DRIVER = "pg"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
